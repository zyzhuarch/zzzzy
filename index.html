<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>看看你花了多少!</title>
    <link rel="apple-touch-icon" href="icon.jpg">
    <link rel="icon" type="image/jpg" sizes="192x192" href="icon.jpg">
    <link rel="icon" type="image/jpg" sizes="512x512" href="icon.jpg">
    <meta name="apple-mobile-web-app-title" content="BE RICH"> 
    <meta name="apple-mobile-web-app-capable" content="yes"> 
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">    
</head>
<body>
    <div id="loading-screen">
        <div class="loader" id="loader-text">♞ YONGZHU ♞</div>
    </div>
    
    <script>
        const loaderText = document.getElementById('loader-text');
        const text = loaderText.innerText;
        loaderText.innerHTML = '';
        text.split('').forEach((char, i) => {
            const span = document.createElement('span');
            // 如果遇到空白字元，要轉換成 HTML 的不斷行空白，不然排版會壞掉
            span.innerText = char === ' ' ? '\u00A0' : char; 
            // 每個字元依序延遲 0.08 秒起跳，創造波浪效果
            span.style.animationDelay = `${i * 0.08}s`; 
            loaderText.appendChild(span);
        });
    </script>

    <div class="header">
        <div class="header-spacer"></div> <span>看看你花了多少!</span>
        <div class="menu-icon" onclick="toggleMenu(true)">
            <div></div><div></div><div></div>
        </div>
    </div>

    <div id="menu-overlay" onclick="toggleMenu(false)"></div>
    <div id="nav-drawer">
        <div class="drawer-header">
            <span class="close-btn" onclick="toggleMenu(false)">✕</span>
        </div>
        <div class="drawer-content">
            <div class="nav-item active" onclick="handleNav('daily')">日支出/記帳</div>
            <div class="nav-item" onclick="handleNav('monthly')">月紀錄明細</div>
        </div>
    </div>

    <div id="main-container">
        <div id="daily-view">
            <div id="stats-section">
                <div class="toggle-group main-toggle">
                    <button class="toggle-btn active" onclick="switchTab('chart', this)">圓餅圖</button>
                    <button class="toggle-btn" onclick="switchTab('list', this)">條列檢視</button>
                </div>  
                <div id="display-area">
                    <div id="chart-container">
                        <canvas id="expenseChart"></canvas>
                        <div id="chart-center-text"></div>
                    </div>
                    <div id="list-container-wrapper">
                        <div id="list-total"></div>
                        <div id="list-container"></div>
                    </div>
                </div>
            </div>

            <div id="input-section">
                <div class="type-toggle-group">
                    <button id="type-exp" class="type-btn active" onclick="setRecordType('expense')">支出</button>
                    <button id="type-inc" class="type-btn" onclick="setRecordType('income')">收入</button>
                </div>

                <div class="section-title">選擇分類</div>
                <div id="category-grid" class="category-grid"></div>
                <div class="input-group">
                    <input type="date" id="date-input">
                    <input type="number" id="amount-input" placeholder="金額" inputmode="decimal">
                </div>
                <div class="input-group">
                    <input type="text" id="memo-input" placeholder="備註 (選填)">
                </div>
                
                <button id="add-btn" onclick="addRecord()">確認紀錄</button>
            </div>
        </div>

        <div id="monthly-view">
            <div id="monthly-content"></div>
        </div>
    </div>

    <div id="day-detail-modal">
        <div class="modal-header">
            <span class="back-btn" onclick="closeDayDetail()">⬱返回</span>
            <span id="detail-date-title">日期</span>
            <div style="width: 60px;"></div>
        </div>
        <div class="modal-content">
            <div id="detail-chart-container">
                <canvas id="detailExpenseChart"></canvas>
                <div id="detail-chart-center-text"></div>
            </div>
            <div id="detail-list-container"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
