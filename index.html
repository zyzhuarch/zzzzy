<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>看看你花了多少!</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">    
</head>
<body>
    <div id="loading-screen">
        <div class="loader">Yong-Zhu</div>
    </div>

    <div class="header">
        <span>看看你花了多少!</span>
    </div>

    <!-- 唯一的主畫面 -->
    <div id="main-container">
        
        <!-- 上半部：統計與紀錄區 -->
        <div id="stats-section">
            <div class="toggle-group">
                <button class="toggle-btn active" onclick="switchTab('chart')">圓餅圖</button>
                <button class="toggle-btn" onclick="switchTab('list')">條列檢視</button>
            </div>  
            
            <div id="display-area">
                <div id="chart-container"><canvas id="expenseChart"></canvas></div>
                <div id="list-container"></div>
            </div>
        </div>

        <hr class="divider">

        <!-- 下半部：輸入區 -->
        <div id="input-section">
            <div class="section-title">選擇分類</div>
            <div id="category-grid" class="category-grid"></div>
            
            <div class="input-group">
                <input type="number" id="amount-input" placeholder="輸入金額" inputmode="decimal">
                <input type="text" id="memo-input" placeholder="備註 (選填)">
            </div>
            
            <button id="add-btn" onclick="addExpense()">確認紀錄</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
